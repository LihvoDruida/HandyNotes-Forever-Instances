name: Publish AddOn Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
  CF_API_KEY: ${{ secrets.CF_API_KEY }}
  CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
  GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install release validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Validate CurseForge configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CURSEFORGE_PROJECT_ID}" ]]; then
            echo "Repository variable CURSEFORGE_PROJECT_ID is not configured." >&2
            exit 1
          fi
          if [[ -z "${CF_API_KEY}" ]]; then
            echo "Repository secret CF_API_KEY is not configured." >&2
            exit 1
          fi

      - name: Run pre-release gate
        run: ./check_all.sh

      - name: Package and publish
        uses: BigWigsMods/packager@v2
        with:
          args: -p ${{ vars.CURSEFORGE_PROJECT_ID }}
