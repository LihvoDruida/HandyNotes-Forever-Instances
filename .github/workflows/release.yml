name: Publish AddOn Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CURSEFORGE_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID || vars.CURSEFORGE_PROJECT_ID }}
  CF_API_KEY: ${{ secrets.CF_API_KEY }}
  CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
  GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install release validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Apply requested release version
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/set_version.py "$GITHUB_REF_NAME"

          VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -Fq "## [$VERSION]" CHANGELOG.md; then
            echo "Generating CHANGELOG.md for $GITHUB_REF_NAME from the current tag..."
            git-cliff --current --latest --prepend CHANGELOG.md
          else
            echo "CHANGELOG.md already contains release section $VERSION"
          fi

      - name: Validate CurseForge configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CURSEFORGE_PROJECT_ID}" ]]; then
            echo "CURSEFORGE_PROJECT_ID is not configured as a repository secret or variable." >&2
            exit 1
          fi
          if [[ -z "${CF_API_KEY}" ]]; then
            echo "Repository secret CF_API_KEY is not configured." >&2
            exit 1
          fi

      - name: Run pre-release gate
        shell: bash
        run: bash ./check_all.sh

      - name: Package and publish
        uses: BigWigsMods/packager@v2
        with:
          args: -p ${{ env.CURSEFORGE_PROJECT_ID }}
